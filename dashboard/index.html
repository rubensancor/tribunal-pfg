<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tribunal PFG</title>
<style>
:root {
  --bg: #f5f4f0; --panel: #fff; --ink: #1c1c1e; --muted: #6a6a70; --line: #e3e1da;
  --accent: #1f4fd1; --accent-soft: #e9eefc; --warn: #9a5800; --warn-soft: #fcf0dc;
  --ok: #1b7543; --ok-soft: #e2f3e9; --bad: #b42318; --bad-soft: #fcebe9; --violet: #6a3fc1; --violet-soft: #f0eafb;
  --radius: 10px; --shadow: 0 1px 2px rgb(0 0 0 / .05); color-scheme: light;
}
:root[data-tema="noche"] {
  --bg: #131315; --panel: #1c1c1f; --ink: #ececef; --muted: #9b9ba3; --line: #2c2c32;
  --accent: #84a6ff; --accent-soft: #1d2744; --warn: #f0b25a; --warn-soft: #362816;
  --ok: #6fd39a; --ok-soft: #15301f; --bad: #ff8a80; --bad-soft: #3a1b19; --violet: #b99bff; --violet-soft: #2a2140;
  --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--muted); }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 20px; }

.top { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 12px; height: 60px; }
.marca { font-weight: 650; font-size: 17px; color: var(--ink); text-decoration: none; letter-spacing: -.01em; }
.marca span { color: var(--muted); font-weight: 450; }
.top .acciones { margin-left: auto; display: flex; gap: 8px; }

.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  border-radius: 8px; padding: 7px 13px; font: inherit; font-weight: 550; cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
[data-tema="noche"] .btn.primary { color: #0d1430; }
#tema { padding: 7px 9px; }
#tema svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }
#tema svg:not(.ver) { display: none; }
#preparar { margin: 0; accent-color: var(--accent); }

main.wrap { padding-top: 28px; padding-bottom: 60px; }
h1 { font-size: 24px; line-height: 1.25; margin: 6px 0 4px; letter-spacing: -.015em; }
.resumen { margin: 0 0 18px; color: var(--muted); }
.resumen b { color: var(--ink); font-variant-numeric: tabular-nums; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.card { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 8px; box-shadow: var(--shadow); }
.card:hover { border-color: var(--muted); }
.card h2 { font-size: 16px; line-height: 1.35; margin: 0; }
.card h2 a { color: var(--ink); text-decoration: none; }
.card h2 a::after { content: ""; position: absolute; inset: 0; }
.card .meta { display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
.card .abajo { margin-top: auto; display: grid; gap: 10px; padding-top: 4px; }
.card .pie { display: flex; gap: 14px; font-size: 13px; color: var(--muted); }
.card .pie .ir { position: relative; z-index: 1; margin-left: auto; font-weight: 550; text-decoration: none; }
.card .marca-sel { display: flex; align-items: center; gap: 6px; }
.card .sel { position: relative; z-index: 1; display: grid; place-items: center; width: 28px; height: 28px; margin: -6px 0 -6px -7px; border-radius: 6px; cursor: pointer; }
.card .sel:hover { background: var(--accent-soft); }
.card .sel input { margin: 0; width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }
.card:has([data-sel]:checked) { border-color: var(--accent); background: color-mix(in srgb, var(--accent-soft) 55%, var(--panel)); box-shadow: 0 0 0 1px var(--accent); }
.card.saliendo { opacity: 0; transform: scale(.96); transition: opacity .18s ease-out, transform .18s ease-out; }
#seleccion { --x: -50%; position: fixed; z-index: 6; left: 50%; bottom: 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px;
  max-width: calc(100% - 32px); padding: 8px 8px 8px 18px; border-radius: 12px; background: var(--ink); color: var(--bg);
  box-shadow: 0 10px 30px rgb(0 0 0 / .22), 0 2px 6px rgb(0 0 0 / .12);
  transform: translate(var(--x), calc(100% + 28px)); visibility: hidden; transition: transform .32s cubic-bezier(.16, 1, .3, 1), visibility 0s .32s; }
#seleccion.visible { transform: translate(var(--x), 0); visibility: visible; transition: transform .32s cubic-bezier(.16, 1, .3, 1); }
#seleccion .cuenta { font-variant-numeric: tabular-nums; white-space: nowrap; }
#seleccion .btn.enlace { color: color-mix(in srgb, var(--bg) 78%, var(--ink)); font-size: 14px; }
#seleccion .btn.enlace:hover { color: var(--bg); }
#seleccion :focus-visible { outline-color: var(--bg); }
#seleccion .btn.borrar { margin-left: auto; }
body:has(#seleccion.visible) #aviso { bottom: 88px; }
body:has(#seleccion.visible) #main { padding-bottom: 96px; }

.badge { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 99px; background: var(--line); color: var(--muted); }
.badge.leyendo { background: var(--warn-soft); color: var(--warn); }
.badge.leido { background: var(--accent-soft); color: var(--accent); }
.badge.preguntas { background: var(--violet-soft); color: var(--violet); }
.badge.clasificadas { background: var(--ok-soft); color: var(--ok); }

.prog { margin-top: 4px; height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
.prog div { height: 100%; background: var(--warn); transition: width .4s; }

.panel-cola { display: grid; gap: 14px; margin: 0 0 18px; padding: 16px 18px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
.panel-cola h2 { margin: 0; font-size: 14px; font-weight: 650; letter-spacing: .01em; }
.cola-cab { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; font-size: 13px; }
.cola-actual { display: grid; gap: 10px; padding: 12px 14px; border-radius: 10px; background: var(--warn-soft); }
.cola-actual .prog { margin: 0; }
.cola-fila { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
.cola-fila a { font-weight: 650; color: var(--ink); text-decoration: none; overflow-wrap: anywhere; }
.cola-fila a:hover { text-decoration: underline; text-underline-offset: 3px; }
.cola-fila button { margin-left: auto; font-size: 12.5px; padding: 4px 10px; }
.cola-pasos { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 13px; }
.cola-pasos i { font-style: normal; display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
.cola-pasos i::before { content: ""; width: 10px; height: 10px; border-radius: 50%; border: 2px solid currentColor; }
.cola-pasos i.hecho { color: var(--ok); }
.cola-pasos i.hecho::before, .cola-pasos i.ahora::before { background: currentColor; }
.cola-pasos i.ahora { color: var(--warn); font-weight: 600; }
.cola-pasos i.ahora::before { animation: pulso 1.4s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { .cola-pasos i.ahora::before { animation: none; } }
.cola-pasos hr { flex: 0 0 22px; border: 0; border-top: 2px solid var(--line); margin: 0; }
.cola-siguen { list-style: none; margin: 0; padding: 0; display: grid; }
.cola-siguen li { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 8px 2px; font-size: 14px; }
.cola-siguen li + li { border-top: 1px solid var(--line); }
.cola-siguen a { color: var(--ink); text-decoration: none; overflow-wrap: anywhere; }
.cola-siguen a:hover { text-decoration: underline; text-underline-offset: 3px; }
.cola-num { font: 600 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); text-align: right; }
.cola-siguen .muted { font-size: 12.5px; }
.cola-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.badge.cola-mal { background: var(--bad-soft); color: var(--bad); }

.cmd { display: flex; align-items: center; gap: 8px; background: var(--bg); border: 1px dashed var(--line); border-radius: 8px; padding: 6px 6px 6px 10px; }
.cmd code { flex: 1; font: 12.5px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; }
.cmd button { font-size: 12.5px; padding: 4px 10px; }
.accion { position: relative; z-index: 1; display: grid; gap: 8px; }
.accion .botones { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
.btn.peligro { color: var(--bad); }
.btn.peligro:hover { border-color: var(--bad); }
.btn.borrar { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.borrar:hover { background: color-mix(in srgb, var(--bad) 86%, #000); }
[data-tema="noche"] .btn.borrar { color: #2b0b08; }
.btn.borrar svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
#confirmar { width: min(480px, calc(100% - 32px)); padding: 0; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--ink);
  box-shadow: 0 24px 60px rgb(0 0 0 / .28), 0 4px 12px rgb(0 0 0 / .1); }
#confirmar[open] { animation: entra .22s cubic-bezier(.16, 1, .3, 1); }
#confirmar::backdrop { background: rgb(12 12 16 / .45); }
#confirmar form { display: grid; gap: 14px; padding: 22px 22px 18px; }
#confirmar h2 { margin: 0; font-size: 18px; line-height: 1.3; text-wrap: balance; }
#confirmar p { margin: 0; font-size: 14px; }
#confirmar ul { list-style: none; margin: 0; padding: 0; max-height: 40vh; overflow: auto; border: 1px solid var(--line); border-radius: 10px; }
#confirmar li { display: grid; gap: 1px; padding: 9px 12px; }
#confirmar li + li { border-top: 1px solid var(--line); }
#confirmar li .t { font-weight: 550; }
#confirmar li .d { font-size: 13px; color: var(--muted); }
#confirmar li.queda { background: var(--warn-soft); }
#confirmar li.queda .d { color: var(--warn); }
#confirmar .botones { display: flex; justify-content: flex-end; gap: 8px; margin-top: 2px; }
@keyframes entra { from { opacity: 0; transform: translateY(8px) scale(.98); } }
@media (prefers-reduced-motion: reduce) {
  #seleccion, #seleccion.visible, .card.saliendo { transition: none; }
  #confirmar[open] { animation: none; }
}
.btn.enlace { border: 0; background: none; padding: 2px 0; color: var(--accent); font-size: 13px; }
.btn.enlace:hover { text-decoration: underline; text-underline-offset: 3px; }
.accion p { margin: 0; font-size: 13px; }
.ejec { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; }
.ejec.en_curso::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--warn); animation: pulso 1.4s ease-in-out infinite; }
@keyframes pulso { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .ejec.en_curso::before { animation: none; } }
.ejec.fallida, .ejec.detenida, .ejec.sin_avance { color: var(--bad); }
.ejec.en_cola { color: var(--muted); }
.ejec button { font-size: 12.5px; padding: 4px 10px; margin-left: auto; }
pre.log { margin: 8px 0 0; max-height: 320px; overflow: auto; font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
form.ajustes select, form.ajustes input { font: inherit; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); width: 100%; }
form.ajustes .btn { margin-top: 12px; }
.next { display: grid; gap: 8px; background: var(--accent-soft); border-radius: var(--radius); padding: 14px 16px; margin: 18px 0 4px; font-size: 14px; }
.next .cmd { background: var(--panel); }

.vacio { text-align: center; padding: 70px 20px; border: 2px dashed var(--line); border-radius: 14px; color: var(--muted); }
.vacio b { display: block; color: var(--ink); font-size: 17px; margin-bottom: 6px; }
.vacio p { margin: 0 0 6px; }
ol.pasos { display: inline-grid; gap: 4px; text-align: left; margin: 14px 0 0; padding-left: 20px; }
.error { background: var(--bad-soft); color: var(--bad); padding: 10px 14px; border-radius: 8px; }

.det-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
.det-head .botones { display: flex; gap: 8px; }
.crumbs a { text-decoration: none; font-size: 14px; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 20px 0; overflow-x: auto; }
.tabs a { padding: 10px 14px; text-decoration: none; color: var(--muted); font-weight: 550; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs a[aria-current="page"] { color: var(--ink); border-color: var(--accent); }

.ficha { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.bloque { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 18px; box-shadow: var(--shadow); }
.bloque.ancho { grid-column: 1 / -1; }
.bloque h3 { font-size: 14px; font-weight: 650; color: var(--muted); margin: 0 0 6px; }
.leer-primero { grid-column: 1 / -1; background: var(--accent-soft); border-radius: var(--radius); padding: 12px 18px; }
.nota-pie { grid-column: 1 / -1; font-size: 13px; margin: 4px 0 0; }
.bloque.bien h3 { color: var(--ok); }
.bloque.flojo h3 { color: var(--warn); }
.bloque p { margin: 0; }
ul.items { margin: 0; padding-left: 18px; }
ul.items li { margin: 4px 0; }
.pag { display: inline-block; font-size: 12px; font-weight: 600; text-decoration: none; background: var(--accent-soft); padding: 0 7px; border-radius: 99px; white-space: nowrap; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 600; font-size: 13px; }
.eval { font-weight: 600; }
.eval.no { color: var(--bad); } .eval.parcial { color: var(--warn); } .eval.sí { color: var(--ok); }

details.sec { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 8px; box-shadow: var(--shadow); }
details.sec > summary { display: flex; align-items: baseline; gap: 12px; padding: 12px 16px; cursor: pointer; list-style: none; }
details.sec > summary::-webkit-details-marker { display: none; }
details.sec > summary::before { content: ""; align-self: center; flex: none; width: 6px; height: 6px; margin: 0 2px;
  border: solid var(--muted); border-width: 0 1.5px 1.5px 0; transform: rotate(-45deg); transition: transform .15s ease-out; }
details.sec[open] > summary::before { transform: rotate(45deg); }
details.sec.sin-leer > summary { cursor: default; }
details.sec.sin-leer .t { color: var(--muted); font-weight: 500; }
details.sec.sin-leer > summary::before { width: 4px; height: 4px; border: 0; border-radius: 50%; background: var(--muted); transform: none; }
.sec .n { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; }
.sec .t { font-weight: 600; flex: 1; }
.sec .cuerpo { padding: 0 16px 16px 42px; }
.sec h4 { font-size: 13px; color: var(--muted); margin: 14px 0 4px; }
.tag { display: inline-block; font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 6px; background: var(--line); color: var(--ink); }
.tag.aviso { background: var(--warn-soft); color: var(--warn); }

.barra { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 18px; }
.barra .btn { margin-left: auto; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
p.sin { font-size: 13px; margin: 8px 0 0; }
.chips a { text-decoration: none; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 99px; padding: 4px 12px; font-size: 13.5px; }
.chips a b { color: var(--muted); font-weight: 600; margin-left: 4px; font-variant-numeric: tabular-nums; }
.chips a[aria-current="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.chips a[aria-current="true"] b { color: inherit; }
ol.preguntas { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
.q { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow); }
.q-head { display: flex; gap: 10px; align-items: center; font-size: 13px; }
.q-n { font-weight: 700; color: var(--accent); }
.q-text { font-size: 16.5px; line-height: 1.45; margin: 8px 0; font-weight: 520; }
.anclaje { font-size: 13.5px; color: var(--muted); margin: 0 0 6px; }
.q details summary { cursor: pointer; font-size: 13.5px; color: var(--accent); font-weight: 550; }
.q dl { display: grid; grid-template-columns: 150px 1fr; gap: 6px 14px; margin: 10px 0 0; font-size: 14px; }
.q dt { color: var(--muted); font-weight: 600; }
.q dd { margin: 0; }

#suelta { position: fixed; inset: 0; z-index: 20; display: none; place-items: center; background: color-mix(in srgb, var(--accent) 14%, var(--bg)); border: 3px dashed var(--accent); font-size: 20px; font-weight: 650; color: var(--accent); }
body.arrastrando #suelta { display: grid; }
#aviso { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
#aviso.visible { opacity: 1; }

@media (max-width: 720px) {
  .marca span, .barra .btn, .top label.btn { display: none; }
  .marca { white-space: nowrap; font-size: 16px; }
  .top .wrap { gap: 8px; }
  .top .acciones { gap: 6px; }
  .top .btn { padding-inline: 9px; font-size: 14px; }
  .ficha { grid-template-columns: 1fr; }
  .det-head { flex-direction: column; }
  .q dl { grid-template-columns: 1fr; }
  .sec .cuerpo { padding-left: 16px; }
  #seleccion { --x: 0; left: 16px; right: 16px; max-width: none; display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; padding: 10px 10px 10px 16px; }
  #seleccion > :nth-child(even) { justify-self: end; }
  #seleccion .btn.borrar { grid-column: 2; margin: 0; }
  body:has(#seleccion.visible) #aviso { bottom: 124px; }
  body:has(#seleccion.visible) #main { padding-bottom: 132px; }
}
@media print {
  body { background: #fff; color: #000; font-size: 12pt; }
  .top, .tabs, .barra, .next, #registro, .crumbs, .det-head .btn { display: none !important; }
  .q, .bloque, details.sec { box-shadow: none; break-inside: avoid; border-color: #ccc; }
  .q details summary { display: none; }
  .pag { background: none; padding: 0; color: #000; }
}
</style>
<script>
// antes de pintar, para que no parpadee: la elección guardada manda sobre la del sistema
const temaSistema = matchMedia("(prefers-color-scheme: dark)");
let eleccionTema = "sistema";
try { if (["dia", "noche"].includes(localStorage.tema)) eleccionTema = localStorage.tema; } catch {}
function aplicarTema() {
  document.documentElement.dataset.tema = eleccionTema === "sistema" ? (temaSistema.matches ? "noche" : "dia") : eleccionTema;
}
aplicarTema();
</script>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="marca" href="#/">Tribunal PFG <span>· preparación de defensas</span></a>
    <div class="acciones">
      <button class="btn" type="button" id="tema">
        <svg class="sol" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="luna" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
        <svg class="sistema" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
      </button>
      <a class="btn" href="#ajustes">Ajustes</a>
      <label class="btn" title="Al cargar un PDF, lanza la lectura y después las preguntas con los harnesses de Ajustes"><input type="checkbox" id="preparar"> Leer y preguntar al cargar</label>
      <button class="btn primary" type="button" id="cargar">Cargar PFG</button>
    </div>
    <input type="file" id="archivo" accept="application/pdf,.pdf" multiple hidden>
  </div>
</header>
<main class="wrap" id="main" aria-live="polite"></main>
<div id="suelta">Suelta los PDF para cargarlos</div>
<div id="aviso" role="status"></div>
<div id="seleccion" role="region" aria-label="Selección"></div>
<dialog id="confirmar" aria-labelledby="confirmar-titulo" aria-describedby="confirmar-nota">
  <form method="dialog">
    <h2 id="confirmar-titulo"></h2>
    <ul></ul>
    <p class="muted" id="confirmar-nota"></p>
    <div class="botones"><button class="btn" value="no" autofocus>Cancelar</button><button class="btn borrar" value="si"></button></div>
  </form>
</dialog>

<script>
const $ = s => document.querySelector(s);
const h = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const lista = x => Array.isArray(x) ? x : [];
const MAX = 100 * 1024 * 1024;
const ESTADOS = {pendiente: "Pendiente de leer", leyendo: "Leyendo", leido: "Leído", preguntas: "Preguntas sin clasificar", clasificadas: "Listo"};
const TENSIONES = {sin_justificar: "Sin justificar", sin_evidencia: "Sin evidencia", incoherencia: "Incoherencia",
  validacion_debil: "Validación débil", limite_no_explorado: "Límite no explorado", cambio_de_nivel: "Cambio de nivel"};
let pintado = "";  // última respuesta pintada: solo se repinta si algo cambia

// ---------- piezas ----------
const pag = (id, o) => Number.isInteger(o?.pdf)
  ? `<a class="pag" href="/pfgs/${id}/memoria.pdf#page=${o.pdf}" target="_blank" rel="noopener">${o.pag ? "pág. " + h(o.pag) : "PDF " + o.pdf}</a>` : "";
const items = (id, xs, extra = () => "") => lista(xs).length
  ? `<ul class="items">${lista(xs).map(x => `<li>${extra(x)}${h(x?.texto ?? x)} ${pag(id, x)}</li>`).join("")}</ul>`
  : `<p class="muted">—</p>`;
const comando = c => `<div class="cmd"><code>${h(c)}</code><button class="btn" type="button" data-copiar="${h(c)}">Copiar</button></div>`;
// antes de leer la memoria no hay título: el id sale del nombre del archivo
const titulo = p => p.titulo !== p.id ? p.titulo : p.id.replace(/-/g, " ").replace(/^./, c => c.toUpperCase());
const accion = p => p.estado === "preguntas" ? "Clasificar las preguntas" : p.paso === "leer-pfg" ? "Leer la memoria" : "Generar las preguntas";
const EJECUCION = {en_curso: "Ejecutando", terminada: "Terminó", fallida: "Falló", detenida: "Detenida",
  sin_avance: "Terminó sin completar la fase"};
const ejecucion = e => `<div class="ejec ${e.estado}"><span>${EJECUCION[e.estado]}: ${h(e.fase)} con ${h(e.harness)}${e.modelo || e.esfuerzo ? ` (${h([e.modelo, e.esfuerzo && `esfuerzo ${e.esfuerzo}`].filter(Boolean).join(", "))})` : ""}${e.despues && e.estado === "en_curso" ? ` · luego, ${h(e.despues.toLowerCase())}` : ""} · ${fecha(e.inicio)}${e.estado === "fallida" ? ` · código ${e.codigo}` : ""}</span>`
  + `${e.estado === "en_curso" ? `<button class="btn" type="button" data-detener>Detener</button>` : ""}</div>`;
const siguiente = (p, conComando) => {
  const e = p.ejecucion, enCurso = e?.estado === "en_curso";
  if (!enCurso && !p.comando) return "";
  if (p.cola && !enCurso) return `<div class="accion" data-pfg="${p.id}"><div class="ejec en_cola"><span>En cola para leer y preguntar · puesto ${p.cola}</span></div></div>`;
  return `<div class="accion" data-pfg="${p.id}">${e && e.estado !== "terminada" ? ejecucion(e) : ""}
    ${enCurso ? "" : `<div class="botones"><button class="btn primary" type="button" data-ejecutar>${accion(p)} con ${h(p.ejecutor)}</button>
      ${conComando ? "" : `<button class="btn enlace" type="button" data-copiar="${h(p.comando)}" title="${h(p.comando)}">o copia la instrucción para tu agente</button>`}</div>
      ${conComando ? `<p class="muted">O pega esta instrucción en tu agente:</p>${comando(p.comando)}` : ""}`}</div>`;
};
const vacio = (titulo, texto = "") => `<div class="vacio"><b>${titulo}</b>${texto}</div>`;
const error = e => `<p class="error">${h(e)}</p>`;
const fecha = t => new Date(t * 1000).toLocaleString("es-ES", {day: "numeric", month: "short", hour: "numeric", minute: "2-digit"});
const progreso = p => p.leidas < p.secciones
  ? `<div class="prog" role="progressbar" aria-valuenow="${p.leidas}" aria-valuemax="${p.secciones}"><div style="width:${100 * p.leidas / p.secciones}%"></div></div>
     <span class="muted">${p.leidas}/${p.secciones} secciones leídas</span>`
  : `<span class="muted">Secciones leídas · sintetizando…</span>`;

// ---------- vistas ----------
const seleccion = new Set();  // ids marcados en la lista; las casillas se repintan cada 4 s
const PAPELERA = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>`;
const datosBorrado = p => `data-titulo="${h(titulo(p))}" data-detalle="${h([ESTADOS[p.estado], p.estudiante].filter(Boolean).join(" · "))}"${
  p.ejecucion?.estado === "en_curso" ? " data-en-curso" : ""}`;
function repintarSeleccion() {
  const n = seleccion.size, total = document.querySelectorAll("[data-sel]").length;
  $("#seleccion").classList.toggle("visible", n > 0 && total > 0);
  if (!n) return;  // conserva el contenido mientras la barra sale
  $("#seleccion").innerHTML = `<span class="cuenta"><b>${n}</b> ${n === 1 ? "seleccionado" : "seleccionados"}</span>
    ${n < total ? `<button class="btn enlace" type="button" data-sel-todos>Seleccionar todos</button>` : ""}
    <button class="btn enlace" type="button" data-sel-ninguno>Quitar selección</button>
    <button class="btn borrar" type="button" data-borrar-sel>${PAPELERA}Borrar seleccionados</button>`;
}

function panelCola(pfgs) {
  const enMarcha = pfgs.filter(p => p.ejecucion?.estado === "en_curso");
  const enCola = pfgs.filter(p => p.cola).sort((a, b) => a.cola - b.cola);
  if (!enMarcha.length && !enCola.length) return "";
  const fuera = pfgs.filter(p => !p.cola && p.ejecucion?.estado !== "en_curso");
  const mal = p => ["fallida", "sin_avance", "detenida"].includes(p.ejecucion?.estado);
  const listos = fuera.filter(p => p.estado === "clasificadas").length, problemas = fuera.filter(mal).length;
  const sueltos = fuera.length - listos - problemas;
  const cab = [[enMarcha.length, "en marcha"], [enCola.length, "en espera"]].filter(([k]) => k).map(([k, t]) => `${k} ${t}`).join(" · ");
  const chips = [[listos, "clasificadas", listos === 1 ? "listo" : "listos"], [problemas, "cola-mal", "con problemas"], [sueltos, "", "sin preparar"]]
    .filter(([k]) => k).map(([k, c, t]) => `<span class="badge ${c}">${k} ${t}</span>`).join("");
  return `<section class="panel-cola" aria-label="Cola de preparación">
    <div class="cola-cab"><h2>Cola de preparación</h2><span class="muted">${cab}</span></div>
    ${enMarcha.map(p => {
      const lectura = p.ejecucion.paso === "leer-pfg";
      return `<div class="cola-actual" data-pfg="${p.id}">
        <div class="cola-fila"><a href="#/${p.id}">${h(titulo(p))}</a><button class="btn" type="button" data-detener>Detener</button></div>
        <div class="cola-pasos"><i class="${lectura ? "ahora" : "hecho"}">Lectura${lectura && p.secciones ? ` · ${p.leidas}/${p.secciones}` : ""}</i><hr><i class="${lectura ? "" : "ahora"}">Preguntas</i></div>
        ${lectura && p.secciones ? `<div class="prog" role="progressbar" aria-label="Secciones leídas" aria-valuenow="${p.leidas}" aria-valuemax="${p.secciones}"><div style="width:${100 * p.leidas / p.secciones}%"></div></div>` : ""}
      </div>`;
    }).join("")}
    ${enCola.length ? `<ol class="cola-siguen">${enCola.map(p => `<li><span class="cola-num">${p.cola}</span><a href="#/${p.id}">${h(titulo(p))}</a><span class="muted">en espera</span></li>`).join("")}</ol>` : ""}
    ${chips ? `<div class="cola-chips">${chips}</div>` : ""}
  </section>`;
}

function rejilla(pfgs) {
  for (const id of seleccion) if (!pfgs.some(p => p.id === id)) seleccion.delete(id);
  if (!pfgs.length) return vacio("Aún no hay ningún PFG", `<p>Arrastra aquí las memorias en PDF o pulsa «Cargar PFG».</p>
    <ol class="pasos"><li>El agente lee cada memoria y prepara una ficha con las páginas citadas.</li>
      <li>Después propone preguntas para la defensa, ordenadas por prioridad.</li><li>El tribunal decide: la herramienta no califica.</li></ol>`);
  const n = e => pfgs.filter(p => e.includes(p.estado)).length;
  const listos = n(["clasificadas"]);
  const partes = [[n(["pendiente", "leyendo"]), "por leer"], [n(["leido", "preguntas"]), "en preparación"],
    [listos, listos === 1 ? "listo para la defensa" : "listos para la defensa"]].filter(([k]) => k);
  return `${panelCola(pfgs)}<p class="resumen"><b>${pfgs.length}</b> PFG ${pfgs.length === 1 ? "cargado" : "cargados"}: ${partes.map(([k, t]) => `<b>${k}</b> ${t}`).join(" · ")}</p>
    <div class="grid">${pfgs.map(p => `
      <article class="card" style="view-transition-name: pfg-${p.id}">
        <div class="meta"><span class="marca-sel"><label class="sel"><input type="checkbox" data-sel="${p.id}" ${datosBorrado(p)} aria-label="Seleccionar ${h(titulo(p))}"${seleccion.has(p.id) ? " checked" : ""}></label>
          <span class="badge ${p.estado}">${ESTADOS[p.estado]}</span></span><span class="muted">${fecha(p.modificado)}</span></div>
        <h2><a href="#/${p.id}">${h(titulo(p))}</a></h2>
        ${p.estudiante ? `<span class="muted">${h(p.estudiante)}</span>` : ""}
        ${p.estado === "leyendo" ? progreso(p) : ""}
        <div class="abajo"><div class="pie">${p.secciones ? `<span>${p.secciones} secciones</span>` : ""}${p.preguntas ? `<span>${p.preguntas} preguntas</span>` : ""}
          ${p.estado === "clasificadas" ? `<a class="ir" href="#/${p.id}/preguntas">Ver preguntas →</a>` : ""}</div>
        ${siguiente(p)}</div>
      </article>`).join("")}</div>`;
}

function detalle(p, pestana, cat) {
  const a = p.analisis && !p.analisis._error ? p.analisis : null;
  const sub = a ? [a.estudiante, a.titulacion, a.director && "Dir.: " + a.director, a.paginas && a.paginas + " págs."].filter(Boolean).map(h).join(" · ") : "";
  const tabs = [["ficha", "Ficha de lectura"], ["secciones", `Secciones · ${p.leidas}/${p.secciones}`], ["preguntas", `Preguntas · ${lista(p.preguntas).length}`]];
  const vistas = {ficha: vistaFicha, secciones: vistaSecciones, preguntas: vistaPreguntas};
  return `<nav class="crumbs"><a href="#/">← Todos los PFG</a></nav>
    <div class="det-head">
      <div><h1>${h(titulo(p))}</h1><p class="muted"><span class="badge ${p.estado}">${ESTADOS[p.estado]}</span> ${sub}</p></div>
      <div class="botones"><a class="btn" href="/pfgs/${p.id}/memoria.pdf" target="_blank" rel="noopener">Abrir PDF</a>
        <button class="btn peligro" type="button" data-borrar="${p.id}" ${datosBorrado(p)}>Borrar</button></div>
    </div>
    ${p.estado === "leyendo" ? progreso(p) : ""}
    ${siguiente(p) && `<div class="next"><b>Siguiente paso</b>${siguiente(p, true)}</div>`}
    ${p.ejecucion ? `<details class="sec"${["fallida", "sin_avance"].includes(p.ejecucion.estado) ? " open" : ""} id="registro"><summary><span class="t">Registro de la última ejecución</span><span class="muted">${EJECUCION[p.ejecucion.estado]}</span></summary>
      <div class="cuerpo"><pre class="log">${h(p.ejecucion.log)}</pre></div></details>` : ""}
    <nav class="tabs">${tabs.map(([k, t]) => `<a href="#/${p.id}/${k}" ${k === pestana ? 'aria-current="page"' : ""}>${t}</a>`).join("")}</nav>
    <section>${(vistas[pestana] || vistaFicha)(p, cat)}</section>`;
}

function vistaFicha(p) {
  const a = p.analisis;
  if (!a) return vacio("Todavía no hay ficha de lectura", "Aparecerá cuando el agente termine de leer la memoria.");
  if (a._error) return error(a._error);
  const coh = lista(a.coherencia).length ? `<table><thead><tr><th>Objetivo</th><th>¿Evaluado?</th><th>Comentario</th></tr></thead><tbody>${
    lista(a.coherencia).map(c => `<tr><td>${h(c.objetivo)} ${pag(p.id, c)}</td><td><span class="eval ${h(c.evaluado)}">${h(c.evaluado)}</span> ${pag(p.id, c.evaluacion)}</td><td>${h(c.comentario)}</td></tr>`).join("")
  }</tbody></table>` : `<p class="muted">—</p>`;
  return `<div class="ficha">
    ${a.leer_al_menos ? `<p class="leer-primero"><b>Si no hay tiempo, lee al menos:</b> ${h(a.leer_al_menos)}</p>` : ""}
    <div class="bloque ancho"><h3>Qué hace</h3><p>${h(a.que_hace)}</p></div>
    <div class="bloque ancho"><h3>Aportación propia</h3><p>${h(a.aportacion_propia)}</p></div>
    <div class="bloque"><h3>Decisiones clave</h3>${items(p.id, a.decisiones)}</div>
    <div class="bloque"><h3>Resultados principales</h3>${items(p.id, a.resultados)}</div>
    <div class="bloque bien"><h3>Puntos fuertes</h3>${items(p.id, a.fortalezas)}</div>
    <div class="bloque flojo"><h3>Puntos débiles y dudas</h3>${items(p.id, a.debilidades)}</div>
    <div class="bloque ancho"><h3>Coherencia objetivos ↔ resultados</h3>${coh}</div>
    <div class="bloque ancho"><h3>Notas para el tribunal</h3>${items(p.id, a.notas_tribunal)}</div>
    ${a.desfase_paginas ? `<p class="muted nota-pie">Las páginas citadas son la numeración impresa (pág. PDF = pág. impresa + ${h(a.desfase_paginas)}).</p>` : ""}
  </div>`;
}

function vistaSecciones(p) {
  if (!p.indice.length) return vacio("Todavía no hay secciones", "Aparecerán cuando el agente empiece a leer la memoria.");
  return p.indice.map((s, i) => {
    const l = p.lecturas[i];
    const cab = `<span class="n">${String(s.n).padStart(2, "0")}</span><span class="t">${h(s.titulo)}</span><span class="muted">PDF ${s.pdf_ini}–${s.pdf_fin}</span>`;
    if (!l) return `<details class="sec sin-leer"><summary>${cab}<span class="muted">sin leer</span></summary></details>`;
    if (l._error) return `<details class="sec" id="s${i}"><summary>${cab}</summary><div class="cuerpo">${error(l._error)}</div></details>`;
    const nt = lista(l.tensiones).length;
    const bloque = (t, html) => html.includes("<li>") ? `<h4>${t}</h4>${html}` : "";
    return `<details class="sec" id="s${i}"><summary>${cab}${nt ? `<span class="tag aviso">${nt} ${nt > 1 ? "tensiones" : "tensión"}</span>` : ""}</summary>
      <div class="cuerpo">
        <p>${h(l.resumen)}</p>
        ${bloque("Tensiones", items(p.id, l.tensiones, t => `<span class="tag aviso">${h(TENSIONES[t.tipo] || t.tipo)}</span> `))}
        ${bloque("Puntos clave", items(p.id, l.puntos_clave))}
        ${bloque("Decisiones", items(p.id, l.decisiones, d => d.justificada ? "" : `<span class="tag">sin justificar</span> `))}
        ${bloque("Resultados", items(p.id, l.resultados))}
        ${bloque("No legible en el texto", items(p.id, lista(l.no_legible).map(x => ({...x, texto: x.motivo}))))}
      </div></details>`;
  }).join("");
}

function vistaPreguntas(p, cat) {
  if (p.preguntas?._error) return error(p.preguntas._error);
  const qs = lista(p.preguntas).slice().sort((a, b) => a.prioridad - b.prioridad);
  if (!qs.length) return vacio("Todavía no hay preguntas", "Se preparan después de la ficha de lectura.");
  const cls = p.clasificacion && !p.clasificacion._error ? p.clasificacion : null;
  const cats = [...lista(p.categorias), {id: "otra", nombre: "Otra", descripcion: "No encaja en ninguna categoría"}];
  const nombre = Object.fromEntries(cats.map(c => [c.id, c.nombre]));
  const cuenta = id => qs.filter(q => cls?.[q.id]?.categoria === id).length;
  const vacias = cats.filter(c => c.id !== "otra" && !cuenta(c.id) && c.id !== cat).map(c => h(c.nombre));
  const chips = cls ? `<div><nav class="chips" aria-label="Filtrar por categoría">
      <a href="#/${p.id}/preguntas" aria-current="${!cat}">Todas<b>${qs.length}</b></a>
      ${cats.filter(c => cuenta(c.id) || c.id === cat).map(c => `<a href="#/${p.id}/preguntas/${c.id}" aria-current="${cat === c.id}"
        title="${h(c.descripcion)}">${h(c.nombre)}<b>${cuenta(c.id)}</b></a>`).join("")}
    </nav>${vacias.length ? `<p class="muted sin">Sin preguntas de ${vacias.join(", ")}.</p>` : ""}</div>`
    : (p.clasificacion?._error ? error(p.clasificacion._error) : `<p class="muted">Preguntas aún sin clasificar.</p>`);
  const visibles = qs.filter(q => !cat || cls?.[q.id]?.categoria === cat);
  return `<div class="barra">${chips}<button class="btn" type="button" data-imprimir>Imprimir</button></div><ol class="preguntas">${visibles.map(q => {
    const c = cls?.[q.id];
    return `<li class="q">
      <div class="q-head"><span class="q-n">${h(q.id)}</span>${c ? `<span class="tag" title="${h(c.motivo)}">${h(nombre[c.categoria] ?? c.categoria)}</span>` : ""}<span class="muted">prioridad ${h(q.prioridad)}</span></div>
      <p class="q-text">${h(q.pregunta)}</p>
      <p class="anclaje">${pag(p.id, q.anclaje)} ${h(q.anclaje?.seccion)}${q.anclaje?.cita ? ` — «${h(q.anclaje.cita)}»` : ""}</p>
      <details id="q-${h(q.id)}"><summary>Cómo valorar la respuesta</summary>
        <dl><dt>Por qué importa</dt><dd>${h(q.por_que_importa)}</dd><dt>Buena respuesta</dt><dd>${h(q.buena_respuesta)}</dd>
        <dt>Señal de alarma</dt><dd>${h(q.senal_alarma)}</dd><dt>Repregunta</dt><dd>${h(q.repregunta)}</dd></dl>
      </details></li>`;
  }).join("")}</ol>`;
}

// ---------- carga y refresco ----------
let harnesses = {};
const niveles = (hk, modelo) => harnesses[hk].modelos[modelo] ?? harnesses[hk].esfuerzos;
const opcionesEsfuerzo = (lista, actual) => (lista.length ? [["", "el del harness"], ...lista.map(n => [n, n])]
  : [["", "este modelo no lo admite"]]).map(([v, t]) => `<option value="${h(v)}"${v === actual ? " selected" : ""}>${h(t)}</option>`).join("");
function vistaAjustes(c) {
  harnesses = c.harnesses;
  const fila = ([k, f]) => `<tr><td>${h(f.nombre)}</td>
    <td><select name="${k}.harness" aria-label="Harness de ${h(f.nombre)}" data-modelo="${k}">${Object.entries(c.harnesses).map(([hk, hv]) =>
      `<option value="${hk}"${hk === f.harness ? " selected" : ""}>${h(hv.nombre)}</option>`).join("")}</select></td>
    <td><input name="${k}.modelo" value="${h(f.modelo)}" placeholder="el del harness" list="modelos-${f.harness}" aria-label="Modelo de ${h(f.nombre)}" autocomplete="off" data-fase="${k}"></td>
    <td><select name="${k}.esfuerzo" aria-label="Esfuerzo de ${h(f.nombre)}"${niveles(f.harness, f.modelo).length ? "" : " disabled"}>${
      opcionesEsfuerzo(niveles(f.harness, f.modelo), f.esfuerzo)}</select></td></tr>`;
  return `<nav class="crumbs"><a href="#/">← Todos los PFG</a></nav><h1>Ajustes</h1>
    <p class="muted">Qué harness, qué modelo y con cuánto esfuerzo de razonamiento se ejecuta cada fase al pulsar «Ejecutar». Sin modelo o sin esfuerzo, se usa el que tenga configurado el harness.
      El contenido de las memorias llega al proveedor del modelo: usa la herramienta de IA que autorice tu universidad.</p>
    ${c.error ? error(c.error) : ""}
    <form class="bloque ajustes" id="ajustes"><table><thead><tr><th>Fase</th><th>Harness</th><th>Modelo</th><th>Esfuerzo</th></tr></thead>
      <tbody>${Object.entries(c.fases).map(fila).join("")}</tbody></table>
      ${Object.entries(c.harnesses).map(([hk, hv]) => `<datalist id="modelos-${hk}">${Object.keys(hv.modelos).map(m => `<option value="${h(m)}">`).join("")}</datalist>`).join("")}
      <button class="btn primary" type="submit">Guardar</button></form>
    <div class="bloque" style="margin-top:14px"><h3>Harnesses</h3><ul class="items">${Object.values(c.harnesses).map(hv =>
      `<li><b>${h(hv.nombre)}</b>. ${h(hv.nota)}${hv.problema ? `<p class="error">${h(hv.problema)}</p>` : ""}</li>`).join("")}</ul></div>`;
}

async function cargar() {
  const ajustes = location.hash === "#ajustes";
  const [, id, pestana = "ficha", cat] = location.hash.match(/^#\/([a-z0-9-]+)(?:\/(\w+))?(?:\/([a-z0-9-]+))?/) || [];
  let r, txt;
  try { r = await fetch(ajustes ? "/api/config" : id ? `/api/pfgs/${id}` : "/api/pfgs"); txt = await r.text(); }
  catch { return aviso("No se puede conectar con el servidor del dashboard."); }
  if (location.hash + txt === pintado) return;
  pintado = location.hash + txt;
  const abiertos = [...document.querySelectorAll("details[open][id]")].map(d => d.id);
  $("#main").innerHTML = r.status === 404 && id ? vacio("Ese PFG no existe", `<p><a href="#/">Volver</a></p>`)
    : !r.ok ? vacio("El dashboard no ha podido cargar esta página", `<p>${h(JSON.parse(txt || "{}").error || "error " + r.status)}.
        Si acabas de actualizar el dashboard, reinicia el servidor (Ctrl+C y <code>uv run dashboard/server.py</code>).</p><p><a href="#/">Volver</a></p>`)
    : ajustes ? vistaAjustes(JSON.parse(txt)) : id ? detalle(JSON.parse(txt), pestana, cat) : rejilla(JSON.parse(txt));
  abiertos.forEach(i => document.getElementById(i)?.setAttribute("open", ""));
  repintarSeleccion();
}

// Resuelve con los elementos que se pueden borrar, o [] si se cancela. Los que tienen una ejecución en curso se quedan.
function confirmarBorrado(items) {
  const d = $("#confirmar"), si = d.querySelector('[value="si"]');
  const borrables = items.filter(i => !("enCurso" in i.dataset)), n = borrables.length;
  $("#confirmar-titulo").textContent = !n ? "Ahora no se puede borrar" : items.length === 1 ? "¿Borrar este PFG?"
    : n < items.length ? `¿Borrar ${n} de ${items.length} PFG?` : `¿Borrar ${n} PFG?`;
  d.querySelector("ul").innerHTML = items.map(i => "enCurso" in i.dataset
    ? `<li class="queda"><span class="t">${h(i.dataset.titulo)}</span><span class="d">Tiene una ejecución en curso: no se borrará</span></li>`
    : `<li><span class="t">${h(i.dataset.titulo)}</span><span class="d">${h(i.dataset.detalle)}</span></li>`).join("");
  $("#confirmar-nota").textContent = !n ? "Detén la ejecución y vuelve a intentarlo."
    : `${n === 1 ? "Se borran el PDF y todo lo generado a partir de él" : "Se borran los PDF y todo lo generado a partir de ellos"}: resúmenes, fichas, preguntas y registros. No se puede deshacer.`;
  si.innerHTML = `${PAPELERA}${n > 1 ? `Borrar ${n} PFG` : "Borrar"}`;
  si.disabled = !n;
  d.returnValue = "";
  d.showModal();
  return new Promise(fin => d.addEventListener("close", () => fin(d.returnValue === "si" ? borrables : []), {once: true}));
}

async function borrarSeleccion() {
  const marcadas = [...document.querySelectorAll("[data-sel]:checked")];
  const aBorrar = await confirmarBorrado(marcadas);
  if (!aBorrar.length) return;
  let borrados = 0;
  const errores = marcadas.filter(c => !aBorrar.includes(c)).map(c => `«${c.dataset.titulo}» sigue en ejecución.`);
  for (const c of aBorrar) {
    try {
      const r = await fetch(`/api/pfgs/${c.dataset.sel}/borrar`, {method: "POST"});
      if (r.ok) { borrados++; seleccion.delete(c.dataset.sel); c.closest(".card")?.classList.add("saliendo"); }
      else errores.push(`${c.dataset.titulo}: ${(await r.json().catch(() => ({}))).error || "error " + r.status}.`);
    } catch { errores.push(`${c.dataset.titulo}: no se pudo borrar.`); }
  }
  aviso([borrados && `${borrados} PFG ${borrados === 1 ? "borrado" : "borrados"}.`, ...errores].filter(Boolean).join(" "));
  await new Promise(r => setTimeout(r, 180));  // deja terminar el desvanecido de las tarjetas
  pintado = "";
  if (document.startViewTransition && !matchMedia("(prefers-reduced-motion: reduce)").matches) document.startViewTransition(cargar);
  else cargar();
}

async function subir(files) {
  let subidos = 0;
  const errores = [];
  for (const f of [...files]) {  // copia: onchange vacía el FileList tras el primer await
    if (!f.name.toLowerCase().endsWith(".pdf")) { errores.push(`${f.name}: no es un PDF.`); continue; }
    if (f.size > MAX) { errores.push(`${f.name}: ocupa más de 100 MB.`); continue; }
    try {
      const r = await fetch(`/api/pfgs?nombre=${encodeURIComponent(f.name)}${$("#preparar").checked && $("#preparar").checkVisibility() ? "&preparar=1" : ""}`, {method: "POST", body: f});
      if (r.ok) {
        subidos++;
        const {error} = await r.json();
        if (error) errores.push(`${f.name}: cargado, pero no se pudo lanzar la lectura: ${error}.`);
      } else errores.push(`${f.name}: ${(await r.json().catch(() => ({}))).error || "error " + r.status}`);
    } catch { errores.push(`${f.name}: no se pudo subir.`); }
  }
  aviso([subidos && `${subidos} PDF cargado${subidos > 1 ? "s" : ""}.`, ...errores].filter(Boolean).join(" "));
  if (location.hash.length > 2) location.hash = "#/"; else cargar();
}

let avisoT;
function aviso(msg) {
  const el = $("#aviso");
  el.textContent = msg; el.classList.add("visible");
  clearTimeout(avisoT); avisoT = setTimeout(() => el.classList.remove("visible"), 3500);
}

const temas = {
  sistema: { icono: "sistema", siguiente: "dia", titulo: "Sigue al sistema. Pulsa para modo día" },
  dia: { icono: "sol", siguiente: "noche", titulo: "Modo día. Pulsa para modo noche" },
  noche: { icono: "luna", siguiente: "sistema", titulo: "Modo noche. Pulsa para seguir al sistema" },
};
function rotularTema() {
  const { icono, titulo } = temas[eleccionTema];
  document.querySelectorAll("#tema svg").forEach(s => s.classList.toggle("ver", s.classList.contains(icono)));
  $("#tema").title = titulo;
  $("#tema").setAttribute("aria-label", titulo);
}
rotularTema();
$("#tema").onclick = () => {
  eleccionTema = temas[eleccionTema].siguiente;
  try { eleccionTema === "sistema" ? localStorage.removeItem("tema") : localStorage.tema = eleccionTema; } catch {}
  aplicarTema();
  rotularTema();
};
temaSistema.onchange = aplicarTema;
try { $("#preparar").checked = localStorage.preparar === "1"; } catch {}
$("#preparar").onchange = e => { try { e.target.checked ? localStorage.preparar = "1" : localStorage.removeItem("preparar"); } catch {} };
$("#cargar").onclick = () => $("#archivo").click();
$("#archivo").onchange = e => { subir(e.target.files); e.target.value = ""; };
$("#confirmar").addEventListener("click", e => { if (e.target === e.currentTarget) e.currentTarget.close(); });  // clic en el fondo: cancelar
async function post(url, cuerpo) {
  try {
    const r = await fetch(url, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(cuerpo ?? {})});
    if (!r.ok) aviso((await r.json().catch(() => ({}))).error || "error " + r.status);
    return r.ok;
  } catch { aviso("No se puede conectar con el servidor del dashboard."); }
}
document.addEventListener("click", async e => {
  const accion = e.target.closest("[data-ejecutar], [data-detener]");
  if (accion) {
    const id = accion.closest("[data-pfg]").dataset.pfg;
    accion.disabled = true;
    if (await post(`/api/pfgs/${id}/${"ejecutar" in accion.dataset ? "ejecutar" : "detener"}`))
      aviso("ejecutar" in accion.dataset ? "Ejecución lanzada." : "Ejecución detenida.");
    pintado = ""; return cargar();
  }
  const borrar = e.target.closest("[data-borrar]");
  if (borrar) {
    if (!(await confirmarBorrado([borrar])).length) return;
    if (await post(`/api/pfgs/${borrar.dataset.borrar}/borrar`)) { aviso("PFG borrado."); location.hash = "#/"; }
    return;
  }
  if (e.target.closest("[data-borrar-sel]")) return borrarSeleccion();
  const todos = e.target.closest("[data-sel-todos], [data-sel-ninguno]");
  if (todos) {
    document.querySelectorAll("[data-sel]").forEach(c => {
      c.checked = "selTodos" in todos.dataset;
      c.checked ? seleccion.add(c.dataset.sel) : seleccion.delete(c.dataset.sel);
    });
    return repintarSeleccion();
  }
  if (e.target.closest("[data-imprimir]")) return print();
  const b = e.target.closest("[data-copiar]");
  if (!b) return;
  navigator.clipboard.writeText(b.dataset.copiar).then(() => {
    const t = b.dataset.texto ??= b.textContent; b.textContent = "Copiado"; setTimeout(() => b.textContent = t, 1500);
  });
});
document.addEventListener("change", e => {
  const id = e.target.dataset.sel;
  if (!id) return;
  e.target.checked ? seleccion.add(id) : seleccion.delete(id);
  repintarSeleccion();
});
document.addEventListener("input", e => {  // los niveles de esfuerzo dependen del harness y del modelo
  const k = e.target.dataset.modelo || e.target.dataset.fase;
  if (!k) return;
  const harness = document.querySelector(`[name="${k}.harness"]`).value;
  const modelo = document.querySelector(`[name="${k}.modelo"]`);
  const esfuerzo = document.querySelector(`[name="${k}.esfuerzo"]`);
  if (e.target.dataset.modelo && !Object.hasOwn(harnesses[harness].modelos, modelo.value.trim())) modelo.value = "";  // los modelos son de cada harness
  const lista = niveles(harness, modelo.value.trim());
  modelo.setAttribute("list", `modelos-${harness}`);
  esfuerzo.innerHTML = opcionesEsfuerzo(lista, lista.includes(esfuerzo.value) ? esfuerzo.value : "");
  esfuerzo.disabled = !lista.length;
});
document.addEventListener("submit", async e => {
  if (e.target.id !== "ajustes") return;
  e.preventDefault();
  const cfg = {};
  for (const [campo, valor] of new FormData(e.target)) {
    const [fase, clave] = campo.split(".");
    (cfg[fase] ??= {})[clave] = valor.trim();
  }
  if (await post("/api/config", cfg)) { aviso("Ajustes guardados."); pintado = ""; cargar(); }
});
let arrastres = 0;
addEventListener("dragenter", e => { e.preventDefault(); arrastres++; document.body.classList.add("arrastrando"); });
addEventListener("dragleave", () => { if (--arrastres <= 0) { arrastres = 0; document.body.classList.remove("arrastrando"); } });
addEventListener("dragover", e => e.preventDefault());
addEventListener("drop", e => { e.preventDefault(); arrastres = 0; document.body.classList.remove("arrastrando"); subir(e.dataTransfer.files); });
addEventListener("beforeprint", () => document.querySelectorAll("details").forEach(d => d.open = true));
addEventListener("hashchange", () => { pintado = ""; cargar(); scrollTo(0, 0); });
setInterval(() => document.hidden || cargar(), 4000);
cargar();
</script>
</body>
